# ============================================================================
# 🐳 Docker Build Action
# ============================================================================
# Reusable composite action for building and pushing multi-platform Docker images.
# Includes attestations for supply chain security.
#
# Usage:
#   - uses: fulviofreitas/workflow-arsenal/.github/actions/docker-build@master
#     with:
#       image-name: "myorg/myimage"
#       push: true
# ============================================================================

name: "🐳 Docker Build"
description: "Build and push multi-platform Docker images"

inputs:
  image-name:
    description: "Docker image name (e.g., ghcr.io/org/repo)"
    required: true
  context:
    description: "Docker build context"
    required: false
    default: "."
  dockerfile:
    description: "Path to Dockerfile"
    required: false
    default: "Dockerfile"
  platforms:
    description: "Target platforms (comma-separated)"
    required: false
    default: "linux/amd64,linux/arm64"
  push:
    description: "Push image to registry"
    required: false
    default: "false"
  registry:
    description: "Container registry"
    required: false
    default: "ghcr.io"
  registry-username:
    description: "Registry username"
    required: false
    default: ""
  registry-password:
    description: "Registry password/token"
    required: false
    default: ""
  build-args:
    description: "Build arguments"
    required: false
    default: ""
  labels:
    description: "Image labels"
    required: false
    default: ""
  annotations:
    description: "Image annotations"
    required: false
    default: ""
  generate-sbom:
    description: "Generate SBOM"
    required: false
    default: "true"
  generate-provenance:
    description: "Generate provenance attestation"
    required: false
    default: "true"

outputs:
  digest:
    description: "Image digest"
    value: ${{ steps.build.outputs.digest }}
  tags:
    description: "Image tags"
    value: ${{ steps.meta.outputs.tags }}
  metadata:
    description: "Build metadata"
    value: ${{ steps.build.outputs.metadata }}

runs:
  using: "composite"
  steps:
    - name: 🏷️ Get latest tag
      id: get_tag
      shell: bash
      run: |
        git fetch --tags
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        echo "tag=${LATEST_TAG}" >> $GITHUB_OUTPUT
        echo "📌 Latest tag: ${LATEST_TAG:-none}"

    - name: 🛠️ Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

    - name: 🛠️ Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

    - name: 🔐 Log in to registry
      if: inputs.push == 'true' && inputs.registry-password != ''
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: 🏷️ Extract metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
      with:
        images: ${{ inputs.image-name }}
        tags: |
          type=raw,value=latest,enable=${{ inputs.push == 'true' }}
          type=raw,value=${{ steps.get_tag.outputs.tag }},enable=${{ steps.get_tag.outputs.tag != '' && inputs.push == 'true' }}
          type=semver,pattern={{version}},value=${{ steps.get_tag.outputs.tag }}
          type=semver,pattern={{major}}.{{minor}},value=${{ steps.get_tag.outputs.tag }}
          type=sha,prefix=
          type=ref,event=pr

    - name: 📦 Build and push
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: ${{ inputs.platforms }}
        push: ${{ inputs.push }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        annotations: ${{ inputs.annotations }}
        build-args: ${{ inputs.build-args }}
        cache-from: |
          type=gha,scope=${{ github.ref_name }}
          type=gha,scope=main
        cache-to: type=gha,mode=max,scope=${{ github.ref_name }}
        provenance: ${{ inputs.generate-provenance == 'true' && 'mode=min' || 'false' }}
        sbom: ${{ inputs.generate-sbom }}

    - name: 🔧 Install cosign
      if: inputs.push == 'true'
      uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      with:
        # cosign v3 (sigstore bundle as an OCI referrer; on GHCR a sha256-<digest>
        # fallback tag, no .sig tag). Verified 2026-11-20 against ff-k8s Kyverno
        # v1.20.0 ImageValidatingPolicy (ff-k8s docs/operations/image-signing.md).
        # Older Kyverno (<=1.19) cannot read it: re-test before any Kyverno downgrade.
        cosign-release: 'v3.1.5'

    - name: 🔏 Sign image with Cosign (keyless via OIDC)
      if: inputs.push == 'true' && steps.build.outputs.digest != ''
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
        IMAGE: ${{ inputs.image-name }}
      shell: bash
      run: |
        set -euo pipefail
        echo "🔏 Signing ${IMAGE}@${DIGEST}"
        cosign sign --yes "${IMAGE}@${DIGEST}"

    - name: 📋 Generate SPDX SBOM
      if: inputs.push == 'true' && inputs.generate-sbom == 'true' && steps.build.outputs.digest != ''
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
      env:
        # ubuntu-26.04 mounts /tmp as a ~4 GB tmpfs (runner-images#14777);
        # syft stages the image tarball + layer cache under TMPDIR.
        TMPDIR: ${{ runner.temp }}
      with:
        image: ${{ inputs.image-name }}@${{ steps.build.outputs.digest }}
        format: spdx-json
        output-file: sbom.spdx.json
        upload-artifact: false

    - name: 📋 Attest SBOM with Cosign
      if: inputs.push == 'true' && inputs.generate-sbom == 'true' && steps.build.outputs.digest != ''
      env:
        DIGEST: ${{ steps.build.outputs.digest }}
        IMAGE: ${{ inputs.image-name }}
      shell: bash
      run: |
        set -euo pipefail
        cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${DIGEST}"

    # attest-build-provenance runs last and is best-effort: the GitHub REST
    # attestations API rejects requests from user-owned private repos with
    # "Feature not available for user-owned private repositories". Cosign is
    # the primary supply-chain claim; provenance is a bonus SLSA artifact.
    - name: 🔏 Generate attestation
      if: inputs.push == 'true' && inputs.generate-provenance == 'true'
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
      continue-on-error: true
      with:
        subject-name: ${{ inputs.image-name }}
        subject-digest: ${{ steps.build.outputs.digest }}
        push-to-registry: true

    - name: 📊 Generate build summary
      if: always()
      shell: bash
      run: |
        cat >> $GITHUB_STEP_SUMMARY << EOF
        ## 🐳 Docker Build Summary

        | Property | Value |
        |:---------|:------|
        | 📦 Image | \`${{ inputs.image-name }}\` |
        | 🏗️ Platforms | \`${{ inputs.platforms }}\` |
        | 📤 Pushed | \`${{ inputs.push }}\` |
        | 🔏 SBOM | \`${{ inputs.generate-sbom }}\` |
        | 📝 Provenance | \`${{ inputs.generate-provenance }}\` |

        ### 🏷️ Tags

        \`\`\`
        ${{ steps.meta.outputs.tags }}
        \`\`\`

        ---

        <sub>🤖 Built with Docker Buildx</sub>
        EOF
