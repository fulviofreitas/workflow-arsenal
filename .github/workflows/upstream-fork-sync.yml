# =============================================================================
# upstream-fork-sync (reusable)
# =============================================================================
# Detects when the upstream of a fork has advanced and opens a PR with a merge
# commit so the diff is reviewable. Re-runs update the same PR.
#
# Caller example:
#   jobs:
#     sync:
#       uses: fulviofreitas/workflow-arsenal/.github/workflows/upstream-fork-sync.yml@master
#       with:
#         upstream-repo: CoderLuii/HolyClaude
#         upstream-branch: master
#         fork-base-branch: master
#         pr-labels: upstream-sync,automated
#         pr-assignees: fulviofreitas
#       secrets:
#         app-id: ${{ secrets.RENOVATE_APP_ID }}
#         app-private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
# =============================================================================

name: upstream-fork-sync

on:
  workflow_call:
    inputs:
      upstream-repo:
        description: "owner/repo of the upstream"
        required: true
        type: string
      upstream-branch:
        description: "Branch on upstream to track"
        required: false
        type: string
        default: master
      fork-base-branch:
        description: "Branch on the fork to PR into"
        required: false
        type: string
        default: master
      pr-labels:
        description: "Newline-separated label list"
        required: false
        type: string
        default: "upstream-sync\nautomated"
      pr-assignees:
        description: "Comma-separated assignee list"
        required: false
        type: string
        default: ""
    secrets:
      app-id:
        description: "GitHub App ID for token generation"
        required: true
      app-private-key:
        description: "GitHub App private key"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync from upstream
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}

      - name: Checkout fork
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        env:
          UPSTREAM: ${{ inputs.upstream-repo }}
          BR: ${{ inputs.upstream-branch }}
        run: |
          git remote add upstream "https://github.com/${UPSTREAM}.git" || \
            git remote set-url upstream "https://github.com/${UPSTREAM}.git"
          git fetch upstream "${BR}" --no-tags

      - name: Compare
        id: cmp
        env:
          BR: ${{ inputs.upstream-branch }}
        run: |
          set -euo pipefail
          fork_sha=$(git rev-parse HEAD)
          upstream_sha=$(git rev-parse "upstream/${BR}")
          merge_base=$(git merge-base HEAD "upstream/${BR}")
          ahead=$(git rev-list --count "${merge_base}..upstream/${BR}")
          {
            echo "fork_sha=$fork_sha"
            echo "upstream_sha=$upstream_sha"
            echo "ahead=$ahead"
            if [ "$ahead" -gt 0 ]; then echo "changed=true"; else echo "changed=false"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        id: summary
        if: steps.cmp.outputs.changed == 'true'
        env:
          BR: ${{ inputs.upstream-branch }}
        run: |
          set -euo pipefail
          merge_base=$(git merge-base HEAD "upstream/${BR}")
          commits=$(git log --oneline "${merge_base}..upstream/${BR}")
          diffstat=$(git diff --stat "${merge_base}..upstream/${BR}")
          {
            echo 'commits<<COMMITS_EOF'
            echo "$commits"
            echo 'COMMITS_EOF'
            echo 'diffstat<<DIFF_EOF'
            echo "$diffstat"
            echo 'DIFF_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Merge upstream into sync branch
        if: steps.cmp.outputs.changed == 'true'
        env:
          BR: ${{ inputs.upstream-branch }}
          UPSTREAM: ${{ inputs.upstream-repo }}
        run: |
          set -euo pipefail
          short=$(echo "${{ steps.cmp.outputs.upstream_sha }}" | cut -c1-7)
          git checkout -B "upstream-sync/${short}"
          if ! git merge --no-ff "upstream/${BR}" \
               -m "chore(upstream): merge ${UPSTREAM}@${short}"; then
            echo "::warning::merge conflict — leaving branch in conflict state for human review"
            git add -A || true
            git commit --no-edit || true
          fi

      - name: Create / update PR
        if: steps.cmp.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: upstream-sync/${{ steps.cmp.outputs.upstream_sha && format('{0}', steps.cmp.outputs.upstream_sha) }}
          base: ${{ inputs.fork-base-branch }}
          title: "chore(upstream): sync ${{ inputs.upstream-repo }}@${{ steps.cmp.outputs.upstream_sha && steps.cmp.outputs.upstream_sha[:7] }}"
          labels: ${{ inputs.pr-labels }}
          assignees: ${{ inputs.pr-assignees }}
          body: |
            ## Upstream sync

            | | |
            |---|---|
            | Upstream | `${{ inputs.upstream-repo }}` |
            | Upstream HEAD | `${{ steps.cmp.outputs.upstream_sha }}` |
            | Fork HEAD | `${{ steps.cmp.outputs.fork_sha }}` |
            | Commits ahead | ${{ steps.cmp.outputs.ahead }} |

            ### Commits

            ```
            ${{ steps.summary.outputs.commits }}
            ```

            ### Files changed

            ```
            ${{ steps.summary.outputs.diffstat }}
            ```

            <sub>Generated by `fulviofreitas/workflow-arsenal/.github/workflows/upstream-fork-sync.yml`.</sub>
