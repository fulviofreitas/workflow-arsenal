# ============================================================================
# 🔄 Renovate — Self-Renovation
# ============================================================================
# Keeps this repository's own action version references up to date.
# Uses the renovate composite action from this repo.
# ============================================================================

name: 🔄 Renovate

on:
  schedule:
    - cron: "0 */6 * * 1-5"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  renovate:
    name: 🔄 Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 🔄 Run Renovate
        # Local path (not @master/@sha): the checkout above already holds
        # this commit's copy of the action, so no self-pin to keep fresh.
        uses: ./.github/actions/renovate
        with:
          app-id: ${{ secrets.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
