# Builds and publishes ghcr.io/${owner}/agentic-runner, the shared container
# image consumed by the agentic-draft-fix reusable
# workflow in this repo.
#
# The image is deliberately generic (no repo-specific deps). Callers install
# their own pip/npm deps at workflow run time — this keeps the image usable
# by any repo without maintaining a per-repo variant.

name: Build Agentic Runner Image

on:
  push:
    branches: [master]
    paths:
      - .github/docker/agentic-runner.Dockerfile
      - .github/workflows/build-agentic-runner-image.yml
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-agentic-runner-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/agentic-runner
          tags: |
            type=raw,value=latest
            type=sha,prefix=
          labels: |
            org.opencontainers.image.title=agentic-runner
            org.opencontainers.image.description=Shared runner image for the agentic-draft-fix reusable workflow.
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: .github/docker/agentic-runner.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=agentic-runner
          cache-to: type=gha,scope=agentic-runner,mode=max
